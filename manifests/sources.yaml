# Catalogo de fontes — Engine Climatica RS (§6 do documento mestre)
# URLs em nivel de dominio/produto. O endpoint exato e resolvido pelo
# ingestor e gravado no manifesto de proveniencia em cada download.
version: 1
updated: 2026-08-07

# Toda fonte ingerida grava em data/raw/<id>/<yyyymmddTHHMMSS>/:
#   payload.<ext>, provenance.json {url, fetched_at, sha256, product_version,
#   ingestor_version, rows, notes}
provenance_required: [url, fetched_at, sha256, product_version, ingestor_version]

sources:

  # --- 6.1 ENSO e oceano -------------------------------------------------
  cpc_oni:      {provider: NOAA CPC,    domain: cpc.ncep.noaa.gov, freq: monthly, period: "1950-",  anchor_mode: relative_30y, status: core, note: "ONI e media movel de 3 meses da TSM em Nino 3.4 contra base climatologica que o CPC atualiza a cada 5 anos: comparar valor de 1997 com valor de hoje sem a mesma base compara duas reguas."}
  cpc_roni:     {provider: NOAA CPC,    domain: cpc.ncep.noaa.gov, freq: monthly, period: "1950-",  anchor_mode: relative_30y, status: core, note: "Relative ONI — desconta o aquecimento medio dos tropicos. E a resposta do CPC ao fato de que o ONI absoluto passou a marcar El Nino com mais frequencia por tendencia, nao por evento (ADR-005)."}
  psl_nino:     {provider: NOAA PSL,    domain: psl.noaa.gov,      freq: monthly, period: "1870-",  vars: [nino12, nino3, nino34, nino4], status: core, note: "Indices Nino 1+2, 3, 3.4 e 4 em serie longa (1870-). A escolha da regiao muda o evento: Modoki aparece em Nino 4 e some em Nino 1+2."}
  ersst_v5:     {provider: NOAA NCEI,   domain: ncei.noaa.gov,     freq: monthly, period: "1854-",  grid: "2deg", status: core, note: "TSM reconstruida. Antes de 1950 a cobertura vem de navio mercante em rota comercial — a incerteza nao e uniforme no espaco nem no tempo."}
  hadisst:      {provider: Met Office,  domain: metoffice.gov.uk,  freq: monthly, period: "1870-",  grid: "1deg", status: backup}
  cpc_soi:      {provider: NOAA CPC,    domain: cpc.ncep.noaa.gov, freq: monthly, period: "1866-",  status: core, note: "Assinatura atmosferica do mesmo acoplamento que o ONI mede no oceano. SOI muito baixo com ONI muito alto e acoplamento em desacordo, e a discordancia e informacao."}
  jamstec_emi:  {provider: JAMSTEC,     domain: jamstec.go.jp,     freq: monthly, period: "1950-",  status: core, note: "Modoki; Yamagata/Behera"}
  tao_wwv:      {provider: NOAA PMEL,   domain: pmel.noaa.gov,     freq: monthly, period: "1980-",  status: optional, note: "recharge oscillator; dropar se lacunar"}
  iri_plume:    {provider: IRI Columbia,domain: iri.columbia.edu,  freq: monthly, period: "operacional", status: context_only, note: "NAO usar como feature — vazamento de modelo dinamico"}
  nmme:         {provider: IRI DL,      domain: iridl.ldeo.columbia.edu, freq: monthly, period: "1982-", status: phase3}
  ecmwf_seas5:  {provider: Copernicus,  domain: cds.climate.copernicus.eu, freq: monthly, period: "1981-", status: phase3}

  # --- 6.2 Modos extratropicais ------------------------------------------
  cpc_aao:      {provider: NOAA CPC,    domain: cpc.ncep.noaa.gov, freq: daily,   period: "1979-",  status: core, note: "AAO/SAM diario. E preditor fisicamente distinto do ENSO, nao proxy redundante — Thompson e Wallace fundamentam por que."}
  bas_marshall: {provider: BAS,         domain: nerc-bas.ac.uk,    freq: monthly, period: "1957-",  status: core, note: "SAM baseado em ESTACOES, nao em reanalise. Existe justamente porque a versao de reanalise tem tendencia espuria no periodo pre-satelite; manter as duas versoes no bloco e deliberado."}
  ncei_pdo:     {provider: NOAA NCEI,   domain: ncei.noaa.gov,     freq: monthly, period: "1854-",  status: core, note: "Modulacao decadal do Pacifico. Com n=36 no alvo, um indice de periodo ~50 anos contribui menos de um ciclo — entra como contexto, nunca como preditor independente."}
  psl_amo:      {provider: NOAA PSL,    domain: psl.noaa.gov,      freq: monthly, period: "1856-",  status: core, note: "Oscilacao multidecadal do Atlantico. Mesmo problema de amostra do PDO, agravado: o periodo e maior que a serie do alvo."}
  psl_tsa:      {provider: NOAA PSL,    domain: psl.noaa.gov,      freq: monthly, period: "1948-",  status: core, note: "Atlantico Sul tropical. E o vizinho que compete com o Pacifico pela chuva do RS, e a fase concomitante muda a resposta ao ENSO."}
  psl_tna:      {provider: NOAA PSL,    domain: psl.noaa.gov,      freq: monthly, period: "1948-",  status: core, note: "Atlantico Norte tropical. Entra pelo gradiente inter-hemisferico, nao pelo valor absoluto."}
  jamstec_dmi:  {provider: JAMSTEC,     domain: jamstec.go.jp,     freq: monthly, period: "1870-",  status: optional}
  bom_rmm:      {provider: BoM,         domain: bom.gov.au,        freq: daily,   period: "1974-",  status: phase5, note: "MJO; sub-sazonal"}

  # --- 6.3 Reanalise ------------------------------------------------------
  era5:
    provider: Copernicus
    domain: cds.climate.copernicus.eu
    access: cdsapi
    freq: [hourly, daily, monthly]
    period: "1940-"
    grid: "0.25deg"
    status: core
    fields: [z500, mslp, u850, v850, tcwv, sst]
    note: "insumo do HMM de regime (Camada 4) e dos EOFs de PSA"
  era5_land:    {provider: Copernicus, domain: cds.climate.copernicus.eu, grid: "0.1deg", period: "1950-", status: phase5}
  ncep_r1:      {provider: NOAA PSL,   domain: psl.noaa.gov, grid: "2.5deg", period: "1948-", status: backup, note: "unico com cobertura pre-1979"}

  # --- 6.4 Precipitacao ---------------------------------------------------
  inmet_bdmep:
    provider: INMET
    domain: bdmep.inmet.gov.br
    freq: daily
    period: "conv 1961-, autom 2000/2007-"
    status: core
    hazards:
      - "API instavel; exige retry com backoff e cache agressivo"
      - "lacunas nao documentadas — nunca inferir zero de ausente"
      - "QUEBRA convencional->automatica: descontinuidade obrigatoria na Camada 2"
  ana_hidroweb: {provider: ANA, domain: hidroweb.ana.gov.br, freq: daily, period: "1940s-", status: core, hazards: ["codigos inconsistentes", "API cai"]}
  chirps_v2:    {provider: UCSB CHC, domain: chc.ucsb.edu, grid: "0.05deg", freq: daily, period: "1981-", status: core, note: "melhor grade longa para o RS"}
  merge_cptec:  {provider: INPE CPTEC, domain: cptec.inpe.br, grid: "0.1deg", freq: daily, period: "2000-", status: core, note: "melhor qualidade, serie curta"}
  gpcc:         {provider: DWD, domain: dwd.de, grid: "0.25deg", freq: monthly, period: "1891-", status: core, note: "serie mais longa"}
  cpc_unified:  {provider: NOAA CPC, domain: psl.noaa.gov, grid: "0.5deg", freq: daily, period: "1979-", status: backup}
  mswep:        {provider: GloH2O, domain: gloh2o.org, grid: "0.1deg", freq: 3h, period: "1979-", status: backup}

  # --- 6.5 / 6.6 fora do escopo v1, mapeados ------------------------------
  ana_fluvio:   {provider: ANA, domain: hidroweb.ana.gov.br, status: out_of_scope_v1, note: "Jacui, Taquari, Cai, Sinos, Uruguai, Guaiba"}
  sema_rs:      {provider: SEMA-RS, domain: saladesituacao.rs.gov.br, status: out_of_scope_v1}
  ibge_pam:     {provider: IBGE, domain: sidra.ibge.gov.br, freq: annual, period: "1974-", status: out_of_scope_v1}
  conab:        {provider: CONAB, domain: conab.gov.br, status: out_of_scope_v1}

  # --- 6.7 Territorio fisico: o que a chuva encontra quando cai ------------
  # Estas nao sao fontes climaticas, e por isso quase nao aparecem em catalogo
  # de engine de previsao. Elas decidem o que a previsao SIGNIFICA: 100 mm
  # sobre Latossolo profundo do planalto e 100 mm sobre Neossolo Litolico de
  # encosta sao dois eventos distintos, e ate ingerir isto a central tratava
  # os dois como o mesmo numero.
  ibge_bdia:
    provider: IBGE
    domain: geoservicos.ibge.gov.br
    access: "WFS GetFeature, recorte por bbox do RS"
    scale: "1:250.000"
    status: core
    layers:
      pedo_area: "pedologia — ordem SiBCS, textura, relevo local, pedregosidade"
      vege_area: "vegetacao e uso da terra — fitofisionomia, uso antropico, secundaria"
      geom_area: "geomorfologia — unidade de relevo, forma, densidade de drenagem"
    hazards:
      - "propertyName SEM `geom` devolve 200 com geometry:null em toda feicao — a
         rasterizacao pula tudo e o estado sai com zero km2, sem erro"
      - "bbox em WFS 2.0 com CRS em URN espera LAT,LON; a ordem trocada devolve
         zero feicoes em vez de erro"
      - "rotulos vem quebrados por linha ('suave \nondulado'), herdados da carta
         impressa — normalizar antes de usar como chave"
      - "levantamento com decadas de defasagem em varias folhas: uso antropico e
         vocacao consolidada, nao cobertura do ano corrente"
  ghsl_built:
    provider: JRC / Comissao Europeia
    domain: human-settlement.emergency.copernicus.eu
    product: "GHS-BUILT-S R2023A, epoca 2025, 30 arcsec"
    status: core
    note: "superficie construida — proxy de impermeabilizacao, nao medida dela"
  copernicus_dem:
    provider: ESA / AWS Open Data
    domain: copernicus-dem-90m.s3.amazonaws.com
    product: "Copernicus DEM GLO-90 (derivado do TanDEM-X)"
    grid: "3 arcsec (~90 m)"
    status: core
    note: >
      Declividade MEDIDA, no lugar do adjetivo. O relevo entrava por classe
      qualitativa do IBGE ('ondulado') e o fator LS da erosao cresce quarenta
      vezes do plano ao montanhoso — num fator com essa alavanca, a diferenca
      entre dois adjetivos dominava o resultado. 43 tiles cobrem o estado.
    hazards:
      - "e modelo de SUPERFICIE: mede topo de dossel e telhado, nao o terreno. Em
         area florestada a declividade sai contaminada pela borda da mata"
      - "a 90 m somem talude de corte, barranca de arroio e degrau de terraco: e a
         declividade da ENCOSTA, nao a do talude"
      - "grade em graus: o espacamento leste-oeste varia com a latitude, e usar
         espacamento fixo inclinaria o estado inteiro numa direcao"
      - "tile ausente (oceano, recorte de fronteira) devolve 404 e e resposta
         NORMAL — tratar como erro faz a ingestao depender do formato do litoral"
  osm_recursos:
    provider: OpenStreetMap
    domain: overpass-api.de
    access: "Overpass QL, area ISO3166-2=BR-RS"
    status: core
    licenca: "ODbL — exige atribuicao visivel em obra derivada publicada"
    classes:
      abrigo: "escola, centro comunitario, ginasio, templo — POTENCIAL, nunca cadastro"
      acesso: "heliponto, aerodromo"
      infraestrutura: "subestacao de energia, tratamento e reservatorio de agua"
      suprimento: "posto de combustivel, supermercado"
    hazards:
      - "colaborativa: ausencia no mapa nao prova ausencia no territorio, e a
         cobertura e pior no interior — que e tambem onde ha menos recurso real,
         entao o vies empurra na direcao errada"
      - "abrigo nao tem capacidade, banheiro, cozinha nem gerador declarados; a
         lista real e da Defesa Civil municipal e nao existe em base publica"
      - "storage_tank cobre tanque de combustivel e de efluente — filtrar por
         `content` antes de contar como reserva de agua"
      - "Overpass e instancia publica compartilhada: recuo generoso entre
         tentativas, e o header Content-Type e obrigatorio (406 sem ele)"
  cpc_precip:
    provider: NOAA CPC / NOAA PSL
    domain: downloads.psl.noaa.gov
    product: "CPC Global Unified Gauge-Based Analysis of Daily Precipitation"
    grid: "0.5deg"
    freq: daily
    period: "1979- (ate ontem)"
    status: core
    note: >
      A unica fonte ATUAL de chuva no catalogo. Fecha o buraco entre a chuva
      historica (GHCN, termina em 2022) e o oceano do mes corrente: sem ela a
      central nao sabia quanto choveu na semana passada, e portanto nao sabia
      qual dos dois Curve Numbers valia hoje.
    hazards:
      - "celula de ~55 km e maior que a maioria dos municipios do RS: ate 24
         municipios dividem a MESMA celula e nao tem diferenca de chuva no dado"
      - "media de area: tempestade convectiva de 15 km com 120 mm aparece como
         ~20 mm espalhados — subestima o extremo pontual por construcao"
      - "NetCDF-4: scipy.io.netcdf_file NAO le. O GDAL do rasterio le, via
         subdataset netcdf:<arquivo>:precip"
      - "eixo de tempo em HORAS desde 1900-01-01, nao dias. Assumir dias devolve
         datas no ano 4912 sem erro nenhum — serie completa, ordenada e coerente,
         tres mil anos no futuro"
      - "o arquivo do ano corrente traz o ano inteiro com NaN nos dias ainda nao
         processados: cortar antes de publicar, ou a fila de vazios vira seca"
  inmet_automaticas:
    provider: INMET
    domain: apitempo.inmet.gov.br
    status: tentado_indisponivel
    note: >
      Seria a fonte natural — 98 estacoes automaticas so no RS, horarias. A API
      publica devolve a LISTA de estacoes normalmente e responde 204 No Content
      para qualquer consulta de DADOS, em toda data testada (de ontem a tres
      anos atras), com e sem token. O caminho restante e o BDMEP, que exige
      login. Enquanto isso, o CPC cobre o estado com a celula de 55 km
      declarada.
  ana_telemetria:
    provider: ANA
    domain: telemetriaws1.ana.gov.br
    status: mapeado_nao_ingerido
    note: >
      Nivel e vazao de rio em tempo quase real, por SOAP publico e sem chave
      (ListaEstacoesTelemetricas responde). E o insumo que falta para CALIBRAR
      o Curve Number: hoje a camada hidrologica e tabela aplicada, e nenhum
      numero dela foi confrontado com agua medida passando. Proxima ingestao de
      maior retorno depois da declividade real.

  # --- 6.8 Fontes municipais e de territorio -------------------------------
  # Estas entraram com o pivo para Central de Risco e ficaram fora do catalogo
  # por meses: cada ingestor foi escrito com a fonte documentada no proprio
  # modulo, e ninguem voltou aqui. O teste `test_docs.py` passa a exigir que
  # todo ingestor tenha entrada, porque catalogo incompleto e pior que catalogo
  # ausente — ele afirma cobertura que nao tem.
  ibge_munic_rs:
    provider: IBGE
    domain: ftp.ibge.gov.br
    product: "MUNIC 2024 — suplemento Evento Climatico Rio Grande do Sul"
    freq: eventual
    status: core
    note: "497 municipios x ~100 variaveis sobre o evento de 26/04/2024"
    hazards:
      - "e AUTO-DECLARACAO da prefeitura ao IBGE: ha incentivo assimetrico entre
         relatar dano (atrai recurso) e relatar falha de prevencao (expoe gestao)"
      - "municipio que nao respondeu aparece como lacuna, nunca como zero — foi o
         que pos Bage em 1o lugar por NAO ter respondido (ADR-019)"
  ibge_malha_rs:
    provider: IBGE
    domain: servicodados.ibge.gov.br
    product: "Malha municipal 2024, qualidade minima"
    status: core
    note: "base geometrica de tudo: rasterizacao, centroide e recorte por municipio"
  ibge_pop_rs:
    note: "Estimativa, nao censo: e projecao do IBGE para 2024 sobre a base de 2022. Municipio pequeno tem incerteza relativa maior, e e justamente onde a exposicao pesa mais no indice."
    provider: IBGE
    domain: servicodados.ibge.gov.br
    product: "Estimativa populacional 2024 (agregado 6579)"
    status: core
  ana_bacias:
    provider: ANA / SNIRH
    domain: snirh.gov.br
    product: "Divisoes de bacias hidrograficas (ArcGIS REST)"
    status: core
    note: >
      Da o regime de cheia por municipio (fluvial, lagunar, litoraneo). Regime
      lagunar e o que o vento governa: drenagem por gravidade falha justamente
      quando mais se precisa dela.
    hazards:
      - "atribuicao por centroide: municipio a cavaleiro de duas bacias fica com uma"
  cnes_rs:
    provider: DATASUS / Ministerio da Saude
    domain: apidadosabertos.saude.gov.br
    product: "CNES — cadastro de estabelecimentos de saude"
    freq: monthly
    status: core
    hazards:
      - "codigo_tipo_unidade 43 tem rotulo 'Unidade Movel de Nivel Pre-Hospitalar'
         e devolve FARMACIAS — quase quatro mil entrariam como ambulancia"
      - "e ESTABELECIMENTO, nunca leito nem viatura (ADR-036): a frota do SAMU
         opera sob o CNES da central de regulacao e nao aparece uma a uma"
  osm_emergencia:
    provider: OpenStreetMap
    domain: overpass-api.de
    status: core
    licenca: "ODbL — exige atribuicao visivel em obra derivada publicada"
    note: "quarteis de bombeiro, unidades policiais e pontes da malha principal"
    hazards:
      - "colaborativa: ausencia no mapa nao prova ausencia no territorio"
      - "para ponte e EXISTENCIA, nunca estado de conservacao — nao ha laudo, vao,
         carga nem ano de construcao"
  ghcn_rs:
    provider: NOAA NCEI
    domain: ncei.noaa.gov
    product: "GHCN-Daily — chuva diaria"
    period: "1934-2022"
    status: core
    note: >
      A serie diaria mais longa disponivel para o RS. E a base da chuva de
      projeto (Gumbel sobre maximos anuais) da camada hidrologica.
    hazards:
      - "ano de cobertura parcial NAO pode entrar como maximo anual: puxa Gumbel
         inteiro para baixo e a estacao urbana recente e a mais afetada"
      - "termina em 2022 — para chuva atual, ver cpc_precip"
  jrc_gsw:
    provider: JRC / Comissao Europeia
    domain: storage.googleapis.com/global-surface-water
    product: "Global Surface Water v1.4 — transitions (Pekel et al., Nature 2016)"
    period: "1984-2021"
    status: core
    note: >
      Memoria hidrica: onde ja foi agua e hoje nao e. Termina em 2021 e portanto
      NAO contem a cheia de 2024 — o que torna todo cruzamento com o evento uma
      coincidencia entre bases independentes, nao circularidade.
  ibge_quilombola:
    provider: IBGE
    domain: geoservicos.ibge.gov.br
    product: "Censo 2022 — territorios quilombolas"
    status: core
    hazards:
      - "ausencia de territorio mapeado NAO e ausencia de comunidade: o vies e
         sistematico e numa direcao so (ADR-075)"
  ibge_indigena:
    provider: IBGE
    domain: geoservicos.ibge.gov.br
    product: "Base Cartografica 250k — terras indigenas"
    status: core
    hazards:
      - "terra em estudo e terra homologada sao o mesmo poligono e realidades
         opostas: `situacao_juridica` sempre visivel (ADR-076)"
  cpc_enso_advisory:
    provider: NOAA CPC
    domain: cpc.ncep.noaa.gov
    product: "ENSO Diagnostic Discussion (boletim mensal)"
    freq: monthly
    status: core
    note: "o que a autoridade oficial esta dizendo, ao lado do que a engine calcula"
