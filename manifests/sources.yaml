# Catalogo de fontes — Engine Climatica RS (§6 do documento mestre)
# URLs em nivel de dominio/produto. O endpoint exato e resolvido pelo
# ingestor e gravado no manifesto de proveniencia em cada download.
version: 1
updated: 2026-08-07

# Toda fonte ingerida grava em data/raw/<id>/<yyyymmddTHHMMSS>/:
#   payload.<ext>, provenance.json {url, fetched_at, sha256, product_version,
#   ingestor_version, rows, notes}
provenance_required: [url, fetched_at, sha256, product_version, ingestor_version]

sources:

  # --- 6.1 ENSO e oceano -------------------------------------------------
  cpc_oni:      {provider: NOAA CPC,    domain: cpc.ncep.noaa.gov, freq: monthly, period: "1950-",  anchor_mode: relative_30y, status: core}
  cpc_roni:     {provider: NOAA CPC,    domain: cpc.ncep.noaa.gov, freq: monthly, period: "1950-",  anchor_mode: relative_30y, status: core}
  psl_nino:     {provider: NOAA PSL,    domain: psl.noaa.gov,      freq: monthly, period: "1870-",  vars: [nino12, nino3, nino34, nino4], status: core}
  ersst_v5:     {provider: NOAA NCEI,   domain: ncei.noaa.gov,     freq: monthly, period: "1854-",  grid: "2deg", status: core}
  hadisst:      {provider: Met Office,  domain: metoffice.gov.uk,  freq: monthly, period: "1870-",  grid: "1deg", status: backup}
  cpc_soi:      {provider: NOAA CPC,    domain: cpc.ncep.noaa.gov, freq: monthly, period: "1866-",  status: core}
  jamstec_emi:  {provider: JAMSTEC,     domain: jamstec.go.jp,     freq: monthly, period: "1950-",  status: core, note: "Modoki; Yamagata/Behera"}
  tao_wwv:      {provider: NOAA PMEL,   domain: pmel.noaa.gov,     freq: monthly, period: "1980-",  status: optional, note: "recharge oscillator; dropar se lacunar"}
  iri_plume:    {provider: IRI Columbia,domain: iri.columbia.edu,  freq: monthly, period: "operacional", status: context_only, note: "NAO usar como feature — vazamento de modelo dinamico"}
  nmme:         {provider: IRI DL,      domain: iridl.ldeo.columbia.edu, freq: monthly, period: "1982-", status: phase3}
  ecmwf_seas5:  {provider: Copernicus,  domain: cds.climate.copernicus.eu, freq: monthly, period: "1981-", status: phase3}

  # --- 6.2 Modos extratropicais ------------------------------------------
  cpc_aao:      {provider: NOAA CPC,    domain: cpc.ncep.noaa.gov, freq: daily,   period: "1979-",  status: core}
  bas_marshall: {provider: BAS,         domain: nerc-bas.ac.uk,    freq: monthly, period: "1957-",  status: core}
  ncei_pdo:     {provider: NOAA NCEI,   domain: ncei.noaa.gov,     freq: monthly, period: "1854-",  status: core}
  psl_amo:      {provider: NOAA PSL,    domain: psl.noaa.gov,      freq: monthly, period: "1856-",  status: core}
  psl_tsa:      {provider: NOAA PSL,    domain: psl.noaa.gov,      freq: monthly, period: "1948-",  status: core}
  psl_tna:      {provider: NOAA PSL,    domain: psl.noaa.gov,      freq: monthly, period: "1948-",  status: core}
  jamstec_dmi:  {provider: JAMSTEC,     domain: jamstec.go.jp,     freq: monthly, period: "1870-",  status: optional}
  bom_rmm:      {provider: BoM,         domain: bom.gov.au,        freq: daily,   period: "1974-",  status: phase5, note: "MJO; sub-sazonal"}

  # --- 6.3 Reanalise ------------------------------------------------------
  era5:
    provider: Copernicus
    domain: cds.climate.copernicus.eu
    access: cdsapi
    freq: [hourly, daily, monthly]
    period: "1940-"
    grid: "0.25deg"
    status: core
    fields: [z500, mslp, u850, v850, tcwv, sst]
    note: "insumo do HMM de regime (Camada 4) e dos EOFs de PSA"
  era5_land:    {provider: Copernicus, domain: cds.climate.copernicus.eu, grid: "0.1deg", period: "1950-", status: phase5}
  ncep_r1:      {provider: NOAA PSL,   domain: psl.noaa.gov, grid: "2.5deg", period: "1948-", status: backup, note: "unico com cobertura pre-1979"}

  # --- 6.4 Precipitacao ---------------------------------------------------
  inmet_bdmep:
    provider: INMET
    domain: bdmep.inmet.gov.br
    freq: daily
    period: "conv 1961-, autom 2000/2007-"
    status: core
    hazards:
      - "API instavel; exige retry com backoff e cache agressivo"
      - "lacunas nao documentadas — nunca inferir zero de ausente"
      - "QUEBRA convencional->automatica: descontinuidade obrigatoria na Camada 2"
  ana_hidroweb: {provider: ANA, domain: hidroweb.ana.gov.br, freq: daily, period: "1940s-", status: core, hazards: ["codigos inconsistentes", "API cai"]}
  chirps_v2:    {provider: UCSB CHC, domain: chc.ucsb.edu, grid: "0.05deg", freq: daily, period: "1981-", status: core, note: "melhor grade longa para o RS"}
  merge_cptec:  {provider: INPE CPTEC, domain: cptec.inpe.br, grid: "0.1deg", freq: daily, period: "2000-", status: core, note: "melhor qualidade, serie curta"}
  gpcc:         {provider: DWD, domain: dwd.de, grid: "0.25deg", freq: monthly, period: "1891-", status: core, note: "serie mais longa"}
  cpc_unified:  {provider: NOAA CPC, domain: psl.noaa.gov, grid: "0.5deg", freq: daily, period: "1979-", status: backup}
  mswep:        {provider: GloH2O, domain: gloh2o.org, grid: "0.1deg", freq: 3h, period: "1979-", status: backup}

  # --- 6.5 / 6.6 fora do escopo v1, mapeados ------------------------------
  ana_fluvio:   {provider: ANA, domain: hidroweb.ana.gov.br, status: out_of_scope_v1, note: "Jacui, Taquari, Cai, Sinos, Uruguai, Guaiba"}
  sema_rs:      {provider: SEMA-RS, domain: saladesituacao.rs.gov.br, status: out_of_scope_v1}
  ibge_pam:     {provider: IBGE, domain: sidra.ibge.gov.br, freq: annual, period: "1974-", status: out_of_scope_v1}
  conab:        {provider: CONAB, domain: conab.gov.br, status: out_of_scope_v1}

  # --- 6.7 Territorio fisico: o que a chuva encontra quando cai ------------
  # Estas nao sao fontes climaticas, e por isso quase nao aparecem em catalogo
  # de engine de previsao. Elas decidem o que a previsao SIGNIFICA: 100 mm
  # sobre Latossolo profundo do planalto e 100 mm sobre Neossolo Litolico de
  # encosta sao dois eventos distintos, e ate ingerir isto a central tratava
  # os dois como o mesmo numero.
  ibge_bdia:
    provider: IBGE
    domain: geoservicos.ibge.gov.br
    access: "WFS GetFeature, recorte por bbox do RS"
    scale: "1:250.000"
    status: core
    layers:
      pedo_area: "pedologia — ordem SiBCS, textura, relevo local, pedregosidade"
      vege_area: "vegetacao e uso da terra — fitofisionomia, uso antropico, secundaria"
      geom_area: "geomorfologia — unidade de relevo, forma, densidade de drenagem"
    hazards:
      - "propertyName SEM `geom` devolve 200 com geometry:null em toda feicao — a
         rasterizacao pula tudo e o estado sai com zero km2, sem erro"
      - "bbox em WFS 2.0 com CRS em URN espera LAT,LON; a ordem trocada devolve
         zero feicoes em vez de erro"
      - "rotulos vem quebrados por linha ('suave \nondulado'), herdados da carta
         impressa — normalizar antes de usar como chave"
      - "levantamento com decadas de defasagem em varias folhas: uso antropico e
         vocacao consolidada, nao cobertura do ano corrente"
  ghsl_built:
    provider: JRC / Comissao Europeia
    domain: human-settlement.emergency.copernicus.eu
    product: "GHS-BUILT-S R2023A, epoca 2025, 30 arcsec"
    status: core
    note: "superficie construida — proxy de impermeabilizacao, nao medida dela"
  copernicus_dem:
    provider: ESA / AWS Open Data
    domain: copernicus-dem-30m.s3.amazonaws.com
    status: mapeado_nao_ingerido
    note: >
      Declividade real. Hoje o relevo entra por classe qualitativa do IBGE
      ('ondulado'), e o fator LS da erosao cresce quarenta vezes do plano ao
      montanhoso — trocar a classe por declividade medida e a melhoria de maior
      retorno das camadas de terreno. Tiles de 1 grau, ~5,8 MB cada, ~63 para o
      estado, sem chave de acesso.
  osm_recursos:
    provider: OpenStreetMap
    domain: overpass-api.de
    access: "Overpass QL, area ISO3166-2=BR-RS"
    status: core
    licenca: "ODbL — exige atribuicao visivel em obra derivada publicada"
    classes:
      abrigo: "escola, centro comunitario, ginasio, templo — POTENCIAL, nunca cadastro"
      acesso: "heliponto, aerodromo"
      infraestrutura: "subestacao de energia, tratamento e reservatorio de agua"
      suprimento: "posto de combustivel, supermercado"
    hazards:
      - "colaborativa: ausencia no mapa nao prova ausencia no territorio, e a
         cobertura e pior no interior — que e tambem onde ha menos recurso real,
         entao o vies empurra na direcao errada"
      - "abrigo nao tem capacidade, banheiro, cozinha nem gerador declarados; a
         lista real e da Defesa Civil municipal e nao existe em base publica"
      - "storage_tank cobre tanque de combustivel e de efluente — filtrar por
         `content` antes de contar como reserva de agua"
      - "Overpass e instancia publica compartilhada: recuo generoso entre
         tentativas, e o header Content-Type e obrigatorio (406 sem ele)"
  cpc_precip:
    provider: NOAA CPC / NOAA PSL
    domain: downloads.psl.noaa.gov
    product: "CPC Global Unified Gauge-Based Analysis of Daily Precipitation"
    grid: "0.5deg"
    freq: daily
    period: "1979- (ate ontem)"
    status: core
    note: >
      A unica fonte ATUAL de chuva no catalogo. Fecha o buraco entre a chuva
      historica (GHCN, termina em 2022) e o oceano do mes corrente: sem ela a
      central nao sabia quanto choveu na semana passada, e portanto nao sabia
      qual dos dois Curve Numbers valia hoje.
    hazards:
      - "celula de ~55 km e maior que a maioria dos municipios do RS: ate 24
         municipios dividem a MESMA celula e nao tem diferenca de chuva no dado"
      - "media de area: tempestade convectiva de 15 km com 120 mm aparece como
         ~20 mm espalhados — subestima o extremo pontual por construcao"
      - "NetCDF-4: scipy.io.netcdf_file NAO le. O GDAL do rasterio le, via
         subdataset netcdf:<arquivo>:precip"
      - "eixo de tempo em HORAS desde 1900-01-01, nao dias. Assumir dias devolve
         datas no ano 4912 sem erro nenhum — serie completa, ordenada e coerente,
         tres mil anos no futuro"
      - "o arquivo do ano corrente traz o ano inteiro com NaN nos dias ainda nao
         processados: cortar antes de publicar, ou a fila de vazios vira seca"
  inmet_automaticas:
    provider: INMET
    domain: apitempo.inmet.gov.br
    status: tentado_indisponivel
    note: >
      Seria a fonte natural — 98 estacoes automaticas so no RS, horarias. A API
      publica devolve a LISTA de estacoes normalmente e responde 204 No Content
      para qualquer consulta de DADOS, em toda data testada (de ontem a tres
      anos atras), com e sem token. O caminho restante e o BDMEP, que exige
      login. Enquanto isso, o CPC cobre o estado com a celula de 55 km
      declarada.
  ana_telemetria:
    provider: ANA
    domain: telemetriaws1.ana.gov.br
    status: mapeado_nao_ingerido
    note: >
      Nivel e vazao de rio em tempo quase real, por SOAP publico e sem chave
      (ListaEstacoesTelemetricas responde). E o insumo que falta para CALIBRAR
      o Curve Number: hoje a camada hidrologica e tabela aplicada, e nenhum
      numero dela foi confrontado com agua medida passando. Proxima ingestao de
      maior retorno depois da declividade real.
